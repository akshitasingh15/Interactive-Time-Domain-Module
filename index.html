<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EEG Preprocessing Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      #grainient {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #root {
        position: relative;
        z-index: 1;
      }
      @media (min-width: 1021px) {
        .layout { grid-template-columns: 292px minmax(0, 1fr); }
      }
      .sidenav > button {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        pointer-events: none;
      }
      .line-sidebar {
        --accent-color: #2b5ba8;
        --text-color: #48546c;
        --marker-color: #a89880;
        --marker-length: 34px;
        --marker-gap: 8px;
        --tick-scale: 0.45;
        --max-shift: 12px;
        --item-gap: 10px;
        --font-size: 0.9rem;
        position: relative;
        display: flex;
        justify-content: flex-start;
      }
      .line-sidebar--markers { padding-left: calc(var(--marker-length) + var(--marker-gap)); }
      .line-sidebar__list {
        list-style: none;
        margin: 0;
        padding: 0.15rem 0 0.4rem;
        display: flex;
        flex-direction: column;
        gap: var(--item-gap);
      }
      .line-sidebar__item { position: relative; cursor: pointer; }
      .line-sidebar__item:focus { outline: none; }
      .line-sidebar__item:focus-visible .line-sidebar__label {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
        border-radius: 4px;
      }
      .line-sidebar__label {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        font-family: var(--sans);
        font-weight: 500;
        font-size: var(--font-size);
        line-height: 1.25;
        white-space: nowrap;
        color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--text-color));
        transform: translateX(calc(var(--effect, 0) * var(--max-shift)));
      }
      .line-sidebar__index {
        font-family: var(--mono);
        margin-right: 0.55rem;
        font-size: 0.82em;
        font-weight: 500;
        opacity: calc(0.55 + var(--effect, 0) * 0.45);
      }
      .line-sidebar__item.is-done .line-sidebar__index { color: var(--blue); opacity: 0.85; }
      .line-sidebar__marker {
        position: absolute;
        top: 50%;
        left: calc(-1 * var(--marker-length) - var(--marker-gap));
        height: 1px;
        width: var(--marker-length);
        background-color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--marker-color));
        transform-origin: left center;
        transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.5));
      }
      .line-sidebar--markers .line-sidebar__item:not(:last-child)::after {
        content: '';
        position: absolute;
        top: calc(100% + var(--item-gap) / 2);
        left: calc(-1 * var(--marker-length) - var(--marker-gap));
        height: 1px;
        width: calc(var(--marker-length) * var(--tick-scale));
        background-color: var(--marker-color);
        opacity: 0.55;
        transform: translateY(-50%);
      }
      .line-sidebar--scale-tick .line-sidebar__item:not(:last-child)::after {
        transform-origin: left center;
        transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.6));
      }
      .topbar {
        height: 66px;
        padding: 0 28px;
        background: var(--blue-d);
        box-shadow: inset 0 -2px 0 #e7d3a1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0;
        color: #f8f4ea;
        line-height: 1;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--cream);
        border-radius: 10px;
        box-shadow: inset 0 0 0 1px #efe8d8;
      }
      .brand svg {
        width: 22px;
        height: 22px;
        color: var(--blue-d);
      }
      .brand:hover .brand-mark { background: #fff; }
      .brand-name {
        display: flex;
        align-items: baseline;
        gap: 6px;
        white-space: nowrap;
      }
      .brand-eeg {
        color: #f8f4ea;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      .brand-rest {
        color: #d5e2f4;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .top-status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8f4ea14;
        border: 1px solid #e7d3a155;
        border-radius: 999px;
        padding: 6px 6px 6px 14px;
      }
      .progress {
        width: 148px;
        max-width: none;
        flex: none;
        height: 5px;
        margin: 0;
        background: #f8f4ea38;
      }
      .progress div { background: #f2e3bd; }
      .progress-label {
        min-width: 72px;
        text-align: center;
        color: var(--blue-d);
        background: var(--cream);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .sidenav { top: 90px; }
      .viewbar { top: 74px; }
      @media (width <= 720px) {
        .topbar { height: 60px; padding: 0 14px; }
        .brand-mark { width: 32px; height: 32px; }
        .brand-eeg { font-size: 16px; }
        .brand-rest { font-size: 13px; }
        .top-status { background: none; border: 0; padding: 0; gap: 0; }
        .viewbar { top: 68px; }
      }
    </style>
  </head>
  <body>
    <canvas id="grainient" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="grainient.js"></script>
    <script src="line-sidebar.js"></script>
    <script src="topbar.js"></script>
  </body>
</html>
